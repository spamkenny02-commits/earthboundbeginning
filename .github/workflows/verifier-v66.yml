name: Verify V66 phone services offline

on:
  push:
    paths:
      - 'tools/v66/**'
      - 'tests/emulation_v66/**'
      - 'patches/*v66*'
      - '.github/workflows/verifier-v66.yml'
  pull_request:
    paths:
      - 'tools/v66/**'
      - 'tests/emulation_v66/**'
      - 'patches/*v66*'
      - '.github/workflows/verifier-v66.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v66 -v
      - run: python3 -m pip install Pillow
      - run: python3 tools/v66/verify_display.py
