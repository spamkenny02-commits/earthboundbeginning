name: Verify V69 full-storage audit offline

on:
  push:
    paths:
      - 'tools/v69/**'
      - 'tests/emulation_v69/**'
      - '.github/workflows/verifier-v69.yml'
  pull_request:
    paths:
      - 'tools/v69/**'
      - 'tests/emulation_v69/**'
      - '.github/workflows/verifier-v69.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v69 -v
      - run: python3 -m pip install Pillow
      - run: python3 tools/v69/verify_display.py
