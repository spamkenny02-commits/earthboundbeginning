name: Verify V41 IPS offline

on:
  push:
    paths:
      - 'tools/v41/**'
      - 'patches/EarthBound_Beginnings_FR_v41_*.ips'
      - '.github/workflows/verifier-v41.yml'
  pull_request:
    paths:
      - 'tools/v41/**'
      - 'patches/EarthBound_Beginnings_FR_v41_*.ips'
      - '.github/workflows/verifier-v41.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v41 -p test_v41_offline.py -v
