name: Verification patches v14
on:
  push:
    paths:
      - 'patches/EarthBound_Beginnings_FR_v13_*.ips'
      - 'patches/EarthBound_Beginnings_FR_v14_*.ips'
      - 'traduction/v14_multisegments_fr.json'
      - 'traduction/construire_v14.py'
      - 'tests/verifier_fusion_v14.py'
      - '.github/workflows/verifier-v14.yml'
  workflow_dispatch:
jobs:
  verifier-fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier V13 et V14
        run: |
          python tests/verifier_fusion_v13.py
          python tests/verifier_fusion_v14.py
