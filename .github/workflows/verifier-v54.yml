name: Verify V54 IPS offline

on:
  push:
    paths:
      - 'tools/v54/**'
      - 'patches/EarthBound_Beginnings_FR_v54_*.ips'
      - '.github/workflows/verifier-v54.yml'
  pull_request:
    paths:
      - 'tools/v54/**'
      - 'patches/EarthBound_Beginnings_FR_v54_*.ips'
      - '.github/workflows/verifier-v54.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v54 -p test_v54_offline.py -v
