name: Verify V59 IPS offline

on:
  push:
    paths:
      - 'tools/v59/**'
      - 'patches/EarthBound_Beginnings_FR_v59_*.ips'
      - '.github/workflows/verifier-v59.yml'
  pull_request:
    paths:
      - 'tools/v59/**'
      - 'patches/EarthBound_Beginnings_FR_v59_*.ips'
      - '.github/workflows/verifier-v59.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v59 -p test_v59_offline.py -v
