name: Preparation V15
on:
  push:
    paths:
      - 'traduction/v15_candidats_a_valider.json'
      - 'tests/verifier_preparation_v15.py'
      - '.github/workflows/verifier-v15-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression V13 V14
        run: |
          python tests/verifier_fusion_v13.py
          python tests/verifier_fusion_v14.py
      - name: Preparation V15 sans ROM
        run: python tests/verifier_preparation_v15.py
