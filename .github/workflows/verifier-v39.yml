name: Verify V39 IPS offline

on:
  push:
    paths:
      - 'tools/v39/**'
      - 'patches/EarthBound_Beginnings_FR_v39_*.ips'
      - '.github/workflows/verifier-v39.yml'
  pull_request:
    paths:
      - 'tools/v39/**'
      - 'patches/EarthBound_Beginnings_FR_v39_*.ips'
      - '.github/workflows/verifier-v39.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v39 -p test_v39_offline.py -v
