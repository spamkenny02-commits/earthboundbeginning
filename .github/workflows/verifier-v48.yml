name: Verify V48 IPS offline

on:
  push:
    paths:
      - 'tools/v48/**'
      - 'patches/EarthBound_Beginnings_FR_v48_*.ips'
      - '.github/workflows/verifier-v48.yml'
  pull_request:
    paths:
      - 'tools/v48/**'
      - 'patches/EarthBound_Beginnings_FR_v48_*.ips'
      - '.github/workflows/verifier-v48.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v48 -p test_v48_offline.py -v
