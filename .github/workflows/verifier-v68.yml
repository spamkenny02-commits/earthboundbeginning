name: Verify V68 storage audit offline

on:
  push:
    paths:
      - 'tools/v68/**'
      - 'tests/emulation_v68/**'
      - '.github/workflows/verifier-v68.yml'
  pull_request:
    paths:
      - 'tools/v68/**'
      - 'tests/emulation_v68/**'
      - '.github/workflows/verifier-v68.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v68 -v
      - run: python3 -m pip install Pillow
      - run: python3 tools/v68/verify_display.py
