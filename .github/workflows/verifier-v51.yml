name: Verify V51 IPS offline

on:
  push:
    paths:
      - 'tools/v51/**'
      - 'patches/EarthBound_Beginnings_FR_v51_*.ips'
      - '.github/workflows/verifier-v51.yml'
  pull_request:
    paths:
      - 'tools/v51/**'
      - 'patches/EarthBound_Beginnings_FR_v51_*.ips'
      - '.github/workflows/verifier-v51.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v51 -p test_v51_offline.py -v
