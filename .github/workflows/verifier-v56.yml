name: Verify V56 IPS offline

on:
  push:
    paths:
      - 'tools/v56/**'
      - 'patches/EarthBound_Beginnings_FR_v56_*.ips'
      - '.github/workflows/verifier-v56.yml'
  pull_request:
    paths:
      - 'tools/v56/**'
      - 'patches/EarthBound_Beginnings_FR_v56_*.ips'
      - '.github/workflows/verifier-v56.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v56 -p test_v56_offline.py -v
