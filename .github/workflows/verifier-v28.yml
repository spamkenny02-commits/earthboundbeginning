name: Verify V28 IPS offline
on:
  push:
    paths:
      - 'tools/v28/**'
      - 'patches/EarthBound_Beginnings_FR_v28_*.ips'
      - '.github/workflows/verifier-v28.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v28 -p test_v28_offline.py -v
