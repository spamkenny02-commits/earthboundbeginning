name: Verify V76 Pippi translation offline
on:
  push:
    paths: ['tools/v76/**', 'tests/emulation_v76/**', 'patches/*v76*', '.github/workflows/verifier-v76.yml']
  pull_request:
    paths: ['tools/v76/**', 'tests/emulation_v76/**', 'patches/*v76*', '.github/workflows/verifier-v76.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: python3 -m unittest discover -s tools/v76 -v
      - run: python3 tools/v76/verify_display.py
