name: Verify V33 IPS offline
on:
  push:
    paths:
      - 'tools/v33/**'
      - 'patches/EarthBound_Beginnings_FR_v33_*.ips'
      - '.github/workflows/verifier-v33.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v33 -p test_v33_offline.py -v
