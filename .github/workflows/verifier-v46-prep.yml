name: Verify V46 preparation

on:
  push:
    paths:
      - 'tools/v46/**'
      - '.github/workflows/verifier-v46-prep.yml'
  pull_request:
    paths:
      - 'tools/v46/**'
      - '.github/workflows/verifier-v46-prep.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/v46 -p 'test_v46_prep.py' -v
