name: Verify V55 IPS offline

on:
  push:
    paths:
      - 'tools/v55/**'
      - 'patches/EarthBound_Beginnings_FR_v55_*.ips'
      - '.github/workflows/verifier-v55.yml'
  pull_request:
    paths:
      - 'tools/v55/**'
      - 'patches/EarthBound_Beginnings_FR_v55_*.ips'
      - '.github/workflows/verifier-v55.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v55 -p test_v55_offline.py -v
