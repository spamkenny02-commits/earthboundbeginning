name: Verify V49 IPS offline

on:
  push:
    paths:
      - 'tools/v49/**'
      - 'patches/EarthBound_Beginnings_FR_v49_*.ips'
      - '.github/workflows/verifier-v49.yml'
  pull_request:
    paths:
      - 'tools/v49/**'
      - 'patches/EarthBound_Beginnings_FR_v49_*.ips'
      - '.github/workflows/verifier-v49.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v49 -p test_v49_offline.py -v
