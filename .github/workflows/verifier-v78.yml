name: Verify V78 batch checkpoint offline
on:
  push:
    paths: ['tools/v78/**', 'tests/emulation_v78/**', 'patches/*v78*', '.github/workflows/verifier-v78.yml']
  pull_request:
    paths: ['tools/v78/**', 'tests/emulation_v78/**', 'patches/*v78*', '.github/workflows/verifier-v78.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: python3 -m unittest discover -s tools/v78 -v
      - run: python3 tools/v78/verify_display.py
      - run: python3 tools/v78/verify_remaining.py
      - run: python3 tools/v78/verify_help.py
