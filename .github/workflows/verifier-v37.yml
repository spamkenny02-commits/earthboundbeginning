name: Verify V37 IPS offline

on:
  push:
    paths:
      - 'tools/v37/**'
      - 'patches/EarthBound_Beginnings_FR_v37_*.ips'
      - '.github/workflows/verifier-v37.yml'
  pull_request:
    paths:
      - 'tools/v37/**'
      - 'patches/EarthBound_Beginnings_FR_v37_*.ips'
      - '.github/workflows/verifier-v37.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v37 -p test_v37_offline.py -v
