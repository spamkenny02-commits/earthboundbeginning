name: Verify V40 IPS offline

on:
  push:
    paths:
      - 'tools/v40/**'
      - 'patches/EarthBound_Beginnings_FR_v40_*.ips'
      - '.github/workflows/verifier-v40.yml'
  pull_request:
    paths:
      - 'tools/v40/**'
      - 'patches/EarthBound_Beginnings_FR_v40_*.ips'
      - '.github/workflows/verifier-v40.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v40 -p test_v40_offline.py -v
