name: Verify V32 IPS offline
on:
  push:
    paths:
      - 'tools/v32/**'
      - 'patches/EarthBound_Beginnings_FR_v32_*.ips'
      - '.github/workflows/verifier-v32.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v32 -p test_v32_offline.py -v
