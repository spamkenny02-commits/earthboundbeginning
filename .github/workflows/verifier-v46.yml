name: Verify V46 IPS offline

on:
  push:
    paths:
      - 'tools/v46/**'
      - 'patches/EarthBound_Beginnings_FR_v46_*.ips'
      - '.github/workflows/verifier-v46.yml'
  pull_request:
    paths:
      - 'tools/v46/**'
      - 'patches/EarthBound_Beginnings_FR_v46_*.ips'
      - '.github/workflows/verifier-v46.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v46 -p test_v46_offline.py -v
