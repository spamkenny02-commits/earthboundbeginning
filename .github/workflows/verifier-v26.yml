name: Verify V26 offline
on:
  push:
    paths:
      - 'tools/v26/**'
      - '.github/workflows/verifier-v26.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/v26 -p test_v26_offline.py -v
