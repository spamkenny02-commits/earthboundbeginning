name: Verify V24 offline
on:
  push:
    paths:
      - 'tools/v24/**'
      - '.github/workflows/verifier-v24.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/v24 -p test_v24_offline.py -v
