name: Verify V71 Escargo pickup offline
on:
  push:
    paths: ['tools/v71/**', 'tests/emulation_v71/**', 'patches/*v71*', '.github/workflows/verifier-v71.yml']
  pull_request:
    paths: ['tools/v71/**', 'tests/emulation_v71/**', 'patches/*v71*', '.github/workflows/verifier-v71.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v71 -v
      - run: python3 -m pip install Pillow
      - run: python3 tools/v71/verify_display.py
