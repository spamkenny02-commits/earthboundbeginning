name: Verify V45 IPS offline

on:
  push:
    paths:
      - 'tools/v45/**'
      - 'patches/EarthBound_Beginnings_FR_v45_*.ips'
      - '.github/workflows/verifier-v45.yml'
  pull_request:
    paths:
      - 'tools/v45/**'
      - 'patches/EarthBound_Beginnings_FR_v45_*.ips'
      - '.github/workflows/verifier-v45.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v45 -p test_v45_offline.py -v
