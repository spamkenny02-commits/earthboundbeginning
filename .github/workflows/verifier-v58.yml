name: Verify V58 IPS offline

on:
  push:
    paths:
      - 'tools/v58/**'
      - 'patches/EarthBound_Beginnings_FR_v58_*.ips'
      - '.github/workflows/verifier-v58.yml'
  pull_request:
    paths:
      - 'tools/v58/**'
      - 'patches/EarthBound_Beginnings_FR_v58_*.ips'
      - '.github/workflows/verifier-v58.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v58 -p test_v58_offline.py -v
