name: Verify V61 IPS offline

on:
  push:
    paths:
      - 'tools/v61/**'
      - 'patches/EarthBound_Beginnings_FR_v61_*.ips'
      - '.github/workflows/verifier-v61.yml'
  pull_request:
    paths:
      - 'tools/v61/**'
      - 'patches/EarthBound_Beginnings_FR_v61_*.ips'
      - '.github/workflows/verifier-v61.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/v61 -p test_v61_offline.py -v
